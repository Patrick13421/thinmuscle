<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="description" content="薄肌打分器：25 题测薄肌指数与 16 型。四维十六分，不用登录。"/>
<title>薄肌打分器</title>
<style>
:root{
  --g:#15803d;--g2:#16a34a;--g3:#86efac;
  --bg:#f4faf5;--ink:#14532d;--card:#fff;
  --muted:#4d7c5a;--line:#cfead7;--soft:#eaf7ee;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(900px 420px at 8% -8%,#dcfce7,transparent 50%),var(--bg);
  color:var(--ink);min-height:100vh;line-height:1.55;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:460px;margin:0 auto;padding:26px 16px 88px}
.brand{font-weight:900;color:var(--g2);letter-spacing:.06em;font-size:14px}
.meta{margin-top:8px;font-size:13px;color:var(--muted)}
h1{font-size:clamp(1.55rem,5.2vw,1.85rem);margin:16px 0 10px;line-height:1.28;letter-spacing:-.02em}
.lead{color:var(--muted);font-size:15px;margin-bottom:14px}
.btn{
  width:100%;padding:14px 16px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#15803d,#22c55e);color:#fff;
  font-weight:800;font-size:16px;cursor:pointer;
  box-shadow:0 10px 22px rgba(22,163,74,.2);
}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;margin-top:10px}
.btn.dark{background:#14532d;box-shadow:none;margin-top:10px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px 16px;box-shadow:0 10px 28px rgba(20,83,45,.05);
}
.hidden{display:none!important}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g3),var(--g2));transition:.2s}
.qno{font-size:12px;color:var(--g2);font-weight:700;margin-bottom:8px}
.q{font-size:1.15rem;font-weight:800;margin-bottom:12px;line-height:1.4}
.opt{
  width:100%;display:flex;align-items:flex-start;gap:10px;
  text-align:left;margin:8px 0;padding:13px 14px;
  border-radius:14px;border:1px solid var(--line);background:#fbfffc;
  cursor:pointer;font-size:15px;color:var(--ink);line-height:1.4;
}
.opt .abc{
  flex:0 0 26px;width:26px;height:26px;border-radius:8px;
  background:var(--soft);color:var(--g);font-weight:900;font-size:13px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.opt .txt{flex:1}
.opt:hover,.opt:focus{border-color:var(--g2);outline:none;background:#f0fdf4}
.dims{display:flex;flex-direction:column;gap:8px;margin:12px 0 18px}
.dim{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dim b{display:block;font-size:14px;color:var(--g2);margin-bottom:2px}
.dim span{font-size:12px;color:var(--muted);line-height:1.45}
.hero{text-align:center;padding:6px 0 2px}
.code-big{
  font-family:ui-monospace,Consolas,monospace;letter-spacing:.16em;
  color:var(--g2);font-weight:900;font-size:1.75rem;
}
.name-big{font-size:1.4rem;font-weight:900;margin:8px 0 6px}
.subline{color:var(--muted);font-size:14px}
.section{font-size:13px;font-weight:900;color:var(--g2);margin:22px 0 10px;letter-spacing:.02em}
.essay{
  font-size:15px;color:var(--ink);line-height:1.85;
  padding:16px 15px;background:var(--soft);border-radius:14px;
  white-space:pre-wrap;
}
.dim-block{
  margin:0 0 14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;
}
.dim-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:6px}
.dim-head .n{font-weight:900}
.dim-head .lv{color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap}
.dim-comment{font-size:13px;color:var(--ink);margin-bottom:10px;line-height:1.55}
.track{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:10px}
.track>span{display:block;height:100%;background:linear-gradient(90deg,#86efac,#16a34a);border-radius:99px}
.sub{
  display:flex;justify-content:space-between;gap:10px;align-items:flex-start;
  padding:8px 0;border-top:1px dashed var(--line);font-size:13px;
}
.sub:first-of-type{border-top:0}
.sub .left{flex:1;min-width:0}
.sub .sn{font-weight:700;color:var(--ink)}
.sub .sc{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.45}
.sub .pts{font-weight:900;color:var(--g2);white-space:nowrap}
.tip{
  margin-top:16px;padding:12px 14px;border-radius:14px;background:#fff;
  border:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6;
}
.poster{
  margin-top:8px;border:1px dashed var(--line);border-radius:16px;
  background:linear-gradient(160deg,#f0fdf4,#fff 45%,#ecfdf5);
  min-height:200px;padding:18px 16px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
.poster .ph-code{font-family:ui-monospace,Consolas,monospace;font-weight:900;font-size:1.5rem;letter-spacing:.14em;color:var(--g2)}
.poster .ph-name{font-weight:900;font-size:1.1rem}
.poster .ph-score{font-size:13px;color:var(--muted)}
.poster .ph-hint{margin-top:8px;font-size:12px;color:#7aa388;max-width:18em;line-height:1.5}
.foot{margin-top:26px;text-align:center;font-size:12px;color:#7aa388;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">薄肌打分器</div>
  <section id="home">
    <h1>测完告诉你<br/>是哪种薄肌生物。</h1>
    <p class="lead">薄肌质量 · AI使用率 · 孙学 · 黄毛思想。<br/>四维组合出 16 型，类似 MBTI，但更好笑。</p>
    <p class="meta">约 1 分钟 · 25 题 · 不用登录</p>
    <div class="dims" id="dims"></div>
    <button class="btn" id="start" type="button">开始打分</button>
  </section>
  <section id="quiz" class="card hidden">
    <div class="bar"><i id="prog"></i></div>
    <div class="qno" id="qno"></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
  </section>
  <section id="result" class="hidden">
    <div class="card">
      <div class="hero">
        <div class="code-big" id="typecode">SUN</div>
        <h2 class="name-big" id="typename">孙型</h2>
        <p class="subline" id="matchline"></p>
        <p class="subline" id="typeone" style="margin-top:8px;font-size:15px;color:var(--ink);font-weight:600"></p>
      </div>
      <div class="section">该类型的简单解读</div>
      <div class="essay" id="essay"></div>
      <div class="section">四维评分</div>
      <div id="bars"></div>
      <div class="tip">本测试仅供娱乐，请勿当成医学、健身评估或人生判决书。</div>
      <div class="section">结果图</div>
      <div class="poster" id="poster">
        <div class="ph-code" id="phCode">SUN</div>
        <div class="ph-name" id="phName">孙型</div>
        <div class="ph-score" id="phScore">薄肌指数 60</div>
        <div class="ph-hint">正式分享图之后会补上，现在可以先截图保存。</div>
      </div>
      <button class="btn dark" id="savePoster" type="button">查看并保存结果图（即将上线）</button>
      <button class="btn ghost" id="again" type="button">再测一次</button>
    </div>
  </section>
  <p class="foot">仅供娱乐，别拿去面试或相亲。<br/>薄肌打分器</p>
</div>
<script>
const DATA = {"dims": [{"id": "Q", "name": "薄肌质量", "low": "B", "high": "H", "blurb": "镜下诚实度与成材进度", "subs": [{"id": "Q1", "name": "镜下诚实度"}, {"id": "Q2", "name": "训练落实度"}, {"id": "Q3", "name": "体态自信"}, {"id": "Q4", "name": "进步感知"}], "levels": {"低": "纸片本传，侧面吸腹也救不了。", "偏低": "有轮廓错觉，一碰就露馅。", "中": "不丢人也不骄傲，标准薄肌中位数。", "偏高": "朋友会说「你练了吧」，你还谦虚。", "高": "薄肌质量满分档，镜面谈判能力强。"}}, {"id": "A", "name": "AI使用率", "low": "L", "high": "I", "blurb": "计划和借口，谁先被生成", "subs": [{"id": "A1", "name": "提示词依赖"}, {"id": "A2", "name": "计划生成欲"}, {"id": "A3", "name": "执行外包度"}, {"id": "A4", "name": "借口生产率"}], "levels": {"低": "信自己的直觉，AI 只配查天气。", "偏低": "偶尔问问，大部分还是凭感觉瞎练。", "中": "半人半机，提示词和杠铃各一半。", "偏高": "分化表比斜方肌整齐，执行另说。", "高": "人生决策先丢给模型，泵感也要提示词。"}}, {"id": "S", "name": "孙学", "low": "N", "high": "U", "blurb": "「除了身体不行」浓度", "subs": [{"id": "S1", "name": "口头禅浓度"}, {"id": "S2", "name": "自我闭环力"}, {"id": "S3", "name": "身体归因术"}, {"id": "S4", "name": "复读传播力"}], "levels": {"低": "听过孙学，但不背锅也不复读。", "偏低": "群里会笑，生活里不大用。", "中": "懂梗，关键时刻能接一句。", "偏高": "处事带孙味，自我安慰很丝滑。", "高": "孙学圣体：除了身体，逻辑闭环。"}}, {"id": "M", "name": "黄毛思想", "low": "W", "high": "Y", "blurb": "先干再说的互联网动能", "subs": [{"id": "M1", "name": "冲动点火"}, {"id": "M2", "name": "不服动能"}, {"id": "M3", "name": "先干再说"}, {"id": "M4", "name": "场控欲望"}], "levels": {"低": "稳如老狗，先观望再观望。", "偏低": "心里想冲，手指还在收藏夹。", "中": "该冲冲该躺躺，情绪稳定版黄毛。", "偏高": "群聊点火器，现实偶尔真冲。", "高": "黄毛觉醒：口号、发型、行动力三件套。"}}], "types": {"BLNW": {"code": "MILD", "name": "温和薄皮", "one": "除了薄，很安全。", "hook": "不冲不卷不孙，薄得安详。", "essay": "你薄得克制，也稳得克制。镜子不骗人，群聊也不点火，黄毛思想像被家长收走的打火机——你知道它存在，但你不爱点。\n\n别人问你练得怎么样，你通常回答「还行」，其实翻译过来是「别看太仔细」。你不是没有进步，是进步被「低调」滤镜盖住了；你也不是没有欲望，是欲望排队排到了「下周」。\n\n薄肌指数可能不耀眼，但翻车概率更低。在这个人人都想出圈的时代，你选择当一个安全的薄皮生物：不炸群，不立flag，不在厕所反思人生。如果你哪天突然连续练四周，请通知朋友圈——那是稀有天象。"}, "BLNY": {"code": "YEET", "name": "莽一下型", "one": "黄毛启动，肌群缓冲中。", "hook": "身体一般，胆气先到。", "essay": "你的胆气比肱二头先上班。计划还在备忘录里睡午觉，人已经在评论区或夜路上「莽一下」。薄肌质量暂时托底失败，但失败也要有气势——这就是你。\n\n你不是不会怕，是怕完了还是会冲。AI 未必常用，孙学未必常挂嘴边，但黄毛思想一旦亮灯，全世界的「再等等」都变成噪音。\n\n镜子可能还很诚实，诚实到有点残酷；可你的人生节奏更像短视频：三秒决策，十秒行动，事后再加载剧情。建议给肌群也开个会员，不然气势续费会越来越贵。"}, "BLUW": {"code": "COPE", "name": "自我闭环型", "one": "嘴上悟了，卧推还在加载。", "hook": "孙学托底，行动很稳。", "essay": "你很会给失败一个体面结局。逻辑闭环漂亮，卧推数字另说。孙学对你不是笑话，是情绪操作系统：除了身体，其他模块都能自圆其说。\n\n你不乱冲，也不太靠 AI 过日子。你靠的是「想明白了」——想明白为什么没练、为什么晚点练、为什么练了也算没练。安慰剂效果一流，渐进超负荷一般。\n\n如果你愿意把「悟了」改成「去了」，你的闭环会从自我安慰升级成自我强化。在那之前，你是群里最会讲道理的薄肌生物。"}, "BLUY": {"code": "JIAN", "name": "头顶尖尖型", "one": "尖得发光：除了肉，全是戏。", "hook": "质量差 · AI低 · 孙学高 · 黄毛高。", "essay": "恭喜，你属于互联网热梗与现实肌肉之间的经典裂缝：人设尖、气势尖、复读尖，锁骨也尖。\n\n孙学给你剧本，黄毛给你台词，镜子给你打回票。你很少用 AI 精细规划，因为规划会暴露执行；你更擅长临场发挥——发挥完再归因到身体。\n\n头顶尖尖不是发型问题，是能量分配问题：戏份太多，肌纤维太少。你不是没魅力，是魅力暂时没法用臂围衡量。若某天你把一半戏份挪去深蹲，类型名可能要改成「尖转厚」。"}, "BINW": {"code": "PROMPT", "name": "提示词园丁", "one": "计划完美，肱二头另请高明。", "hook": "AI高，人设稳，肉还薄。", "essay": "你的分化表比斜方肌整齐。提示词日更，深蹲偶尔断更。AI 是你的私教、营养师和情绪树洞，唯独不是能替你推杠铃的外骨骼。\n\n你不孙不黄，人很稳，计划很美。问题是美的计划容易停留在对话框：像一座精心浇水的花园，花种在云端。\n\n薄肌质量还在加载，但你的「元能力」很强——你会问对问题。下一步只需要把答案搬进健身房。园丁可以继续浇水，也记得自己下场种块肉。"}, "BINY": {"code": "AGENT", "name": "智能体冲锋", "one": "模型说练，你说马上，镜子说等等。", "hook": "AI拉满还带黄毛。", "essay": "你是人机混合动力：模型出方案，黄毛负责点火。孙学浓度不高，因为你没空闭环——你在冲。\n\n「马上」是你的高频词。马上练、马上改计划、马上试新分化。镜子的反馈往往慢半拍，于是你用更多提示词弥补体感延迟。\n\n你很现代，也很薄。智能体可以并行一百个任务，肱二头不行。把代理冲动绑到固定训练日，你会从「马上」进化成「每周三组」。"}, "BIUW": {"code": "SUN", "name": "孙型", "one": "除了身体不行，其他都还好。", "hook": "质量一般 · AI高 · 孙学高 · 黄毛稳。", "essay": "除了身体不行，其他都还好——这句话对你不是段子，是人生摘要。\n\nAI 帮你把世界解释得井井有条，孙学帮你把缺口焊得天衣无缝。黄毛思想被你按在安静模式：你不爱炸场，爱把逻辑谈圆。训练日志呢？偶尔失踪，像节假日放假的门卫。\n\n你擅长安慰别人，更擅长安慰自己。简历好看，镜子偶发尖锐提醒。如果你愿意让「身体」这一项也进入 KPI，孙型也能长出斜方肌；在那之前，你是精神富哥认证用户。"}, "BIUY": {"code": "SUNK", "name": "孙黄混合燃料", "one": "精神富哥，实体订阅制。", "hook": "孙学 + 黄毛 + AI。", "essay": "嘴上宇宙，身上经济舱。你有梗、有冲、有提示词，缺的是连续八周同一动作。\n\n孙学负责解释，黄毛负责点火，AI 负责生成下一步——三件套齐活，唯独实体进度条像订阅制：月初充值，月中忘了，月末复盘。\n\n你不是空心，是能量散在太多频道。把燃料收束到一组深蹲上，你会可怕；现在这样，你先可怕在群聊里。"}, "HLNW": {"code": "SOLID", "name": "老实成材", "one": "少废话，多组数。", "hook": "质量上来了，人很稳。", "essay": "不炫，不孙，不瞎冲。增肌像上班打卡，薄肌开始离职。\n\n你可能不怎么跟 AI 调情，也不靠复读过日子。你靠的是出现：出现在深蹲架，出现在卧推凳，出现在镜子里越来越难装「还行」。\n\n在这个测试的坐标系里，你属于稀有的「成材且安静」。朋友未必天天听你讲计划，但会突然发现你肩膀宽了。请继续少废话——你的肌肉比文案更会传播。"} const dimById = Object.fromEntries(DATA.dims.map(d=>[d.id,d]));
let i=0, answers={}; // subId -> [scores 0-4]
DATA.dims.forEach(d=>d.subs.forEach(s=>answers[s.id]=[]));

const $=id=>document.getElementById(id);
function show(id){["home","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id)); window.scrollTo({top:0,behavior:"smooth"});}
function avg(a){return a.length? a.reduce((x,y)=>x+y,0)/a.length : 0}
function toLevelFrom10(x){ // 1-10 -> 0-4
  if(x<=2.5) return 0;
  if(x<=4.5) return 1;
  if(x<=6.5) return 2;
  if(x<=8.5) return 3;
  return 4;
}
function rawTo10(raw0to4){ // map 0-4 avg to 1-10
  return Math.max(1, Math.min(10, Math.round(1 + (raw0to4/4)*9)));
}
function subBlurb(pts){
  if(pts<=3) return "这项几乎没亮。";
  if(pts<=5) return "有信号，不稳定。";
  if(pts<=7) return "中等偏上，能看出来。";
  return "这项很显眼。";
}

function renderHome(){
  $("dims").innerHTML = DATA.dims.map(d=>`<div class="dim"><b>${d.name}</b><span>${d.blurb}</span></div>`).join("");
}
function renderQ(){
  const t=DATA.questions[i];
  const d=dimById[t.dim];
  $("qno").textContent = `第 ${i+1} / ${DATA.questions.length} 题 · ${d.name}`;
  $("qtext").textContent = t.q;
  $("prog").style.width = ((i/DATA.questions.length)*100)+"%";
  $("opts").innerHTML="";
  t.opts.forEach(([text,score], idx)=>{
    const b=document.createElement("button");
    b.type="button"; b.className="opt";
    b.innerHTML = `<span class="abc">${ABC[idx]}</span><span class="txt">${text}</span>`;
    b.onclick=()=>{
      answers[t.sub].push(score);
      i++;
      i>=DATA.questions.length?finish():renderQ();
    };
    $("opts").appendChild(b);
  });
}

function finish(){
  $("prog").style.width="100%";
  const subPts={}; // 1-10
  const dimLevels={};
  const letters=[];
  let sumDim=0;
  DATA.dims.forEach(d=>{
    const subs10 = d.subs.map(s=>{
      const raw = avg(answers[s.id]||[2]);
      const pts = rawTo10(raw);
      subPts[s.id]=pts;
      return pts;
    });
    const dim10 = avg(subs10);
    const lv = toLevelFrom10(dim10);
    dimLevels[d.id]=lv;
    sumDim += [20,40,60,80,100][lv];
    letters.push(lv<=2 ? d.low : d.high);
  });
  const key = letters.join("");
  const t = DATA.types[key] || {code:"????",name:"未命名型",one:"组合落在表外。",hook:"",essay:"文案待补。"};
  const score = Math.round(sumDim/4);

  $("typecode").textContent = t.code;
  $("typename").textContent = t.name;
  $("matchline").textContent = `薄肌指数 ${score} · 组合 ${key}`;
  $("typeone").textContent = t.one;
  $("essay").textContent = (t.essay||"").trim();

  $("bars").innerHTML = DATA.dims.map(d=>{
    const lv=dimLevels[d.id];
    const w=[20,40,60,80,100][lv];
    const subs = d.subs.map(s=>{
      const pts=subPts[s.id];
      return `<div class="sub"><div class="left"><div class="sn">${s.id} ${s.name}</div><div class="sc">${subBlurb(pts)}</div></div><div class="pts">${pts}/10</div></div>`;
    }).join("");
    return `<div class="dim-block"><div class="dim-head"><span class="n">${d.name}</span><span class="lv">${LEVELS[lv]}</span></div><div class="track"><span style="width:${w}%"></span></div><div class="dim-comment">${d.levels[LEVELS[lv]]}</div>${subs}</div>`;
  }).join("");

  $("phCode").textContent = t.code;
  $("phName").textContent = t.name;
  $("phScore").textContent = `薄肌指数 ${score} · ${key}`;
  show("result");
}

$("start").onclick=()=>{
  i=0; answers={}; DATA.dims.forEach(d=>d.subs.forEach(s=>answers[s.id]=[]));
  show("quiz"); renderQ();
};
$("again").onclick=()=>$("start").onclick();
$("savePoster").onclick=()=>{
  $("savePoster").textContent="海报稍后补上，先截图吧";
  setTimeout(()=>$("savePoster").textContent="查看并保存结果图（即将上线）",2000);
};
renderHome();
</script>
</body>
</html>
