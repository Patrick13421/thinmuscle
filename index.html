<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="description" content="薄肌打分器：测薄肌指数与搞怪类型。约 1 分钟，不用登录。"/>
<title>薄肌打分器</title>
<style>
:root{
  --g:#15803d;--g2:#16a34a;--g3:#86efac;
  --bg:#f4faf5;--ink:#14532d;--card:#fff;
  --muted:#4d7c5a;--line:#cfead7;--soft:#eaf7ee;--warn:#b45309;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(900px 420px at 8% -8%,#dcfce7,transparent 50%),var(--bg);
  color:var(--ink);min-height:100vh;line-height:1.55;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:460px;margin:0 auto;padding:26px 16px 88px}
.brand{font-weight:900;color:var(--g2);letter-spacing:.06em;font-size:14px}
.meta{margin-top:8px;font-size:13px;color:var(--muted)}
h1{font-size:clamp(1.55rem,5.2vw,1.85rem);margin:16px 0 10px;line-height:1.28;letter-spacing:-.02em}
.lead{color:var(--muted);font-size:15px;margin-bottom:14px}
.btn{
  width:100%;padding:14px 16px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#15803d,#22c55e);color:#fff;
  font-weight:800;font-size:16px;cursor:pointer;
  box-shadow:0 10px 22px rgba(22,163,74,.2);
}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;margin-top:10px}
.btn.dark{background:#14532d;box-shadow:none;margin-top:10px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px 16px;box-shadow:0 10px 28px rgba(20,83,45,.05);
}
.hidden{display:none!important}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g3),var(--g2));transition:.2s}
.qno{font-size:12px;color:var(--g2);font-weight:700;margin-bottom:8px}
.q{font-size:1.18rem;font-weight:800;margin-bottom:12px;line-height:1.4}
.opt{
  width:100%;display:flex;align-items:flex-start;gap:10px;
  text-align:left;margin:8px 0;padding:13px 14px;
  border-radius:14px;border:1px solid var(--line);background:#fbfffc;
  cursor:pointer;font-size:15px;color:var(--ink);line-height:1.4;
}
.opt .abc{
  flex:0 0 26px;width:26px;height:26px;border-radius:8px;
  background:var(--soft);color:var(--g);font-weight:900;font-size:13px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.opt .txt{flex:1}
.opt:hover,.opt:focus{border-color:var(--g2);outline:none;background:#f0fdf4}
.dims{display:flex;flex-direction:column;gap:8px;margin:12px 0 18px}
.dim{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
}
.dim b{display:block;font-size:14px;color:var(--g2);margin-bottom:2px}
.dim span{font-size:12px;color:var(--muted);line-height:1.45}
.hero{text-align:center;padding:6px 0 2px}
.badge-hide{
  display:inline-block;margin-bottom:10px;padding:5px 10px;border-radius:999px;
  background:#fff7ed;color:var(--warn);border:1px solid #fed7aa;font-size:12px;font-weight:800;
}
.code-big{
  font-family:ui-monospace,Consolas,monospace;letter-spacing:.16em;
  color:var(--g2);font-weight:900;font-size:1.7rem;
}
.name-big{font-size:1.35rem;font-weight:900;margin:8px 0 6px}
.subline{color:var(--muted);font-size:14px}
.section{font-size:13px;font-weight:900;color:var(--g2);margin:22px 0 10px;letter-spacing:.02em}
.essay{
  font-size:14px;color:var(--ink);line-height:1.7;
  padding:12px 14px;background:var(--soft);border-radius:14px;
}
.row{margin:0 0 12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
.lab{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px;font-weight:700}
.lab .lv{color:var(--muted);font-weight:700;white-space:nowrap}
.track{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.track>span{display:block;height:100%;background:linear-gradient(90deg,#86efac,#16a34a);border-radius:99px}
.note{margin-top:7px;font-size:13px;color:var(--ink);line-height:1.55}
.tip{
  margin-top:16px;padding:12px 14px;border-radius:14px;background:#fff;
  border:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6;
}
.poster{
  margin-top:8px;border:1px dashed var(--line);border-radius:16px;
  background:linear-gradient(160deg,#f0fdf4,#fff 45%,#ecfdf5);
  min-height:220px;padding:18px 16px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
.poster .ph-code{font-family:ui-monospace,Consolas,monospace;font-weight:900;font-size:1.5rem;letter-spacing:.14em;color:var(--g2)}
.poster .ph-name{font-weight:900;font-size:1.1rem}
.poster .ph-score{font-size:13px;color:var(--muted)}
.poster .ph-hint{margin-top:8px;font-size:12px;color:#7aa388;max-width:18em;line-height:1.5}
.foot{margin-top:26px;text-align:center;font-size:12px;color:#7aa388;line-height:1.6}
.share-box{
  margin-top:10px;padding:12px;border-radius:12px;background:#fbfffc;
  border:1px dashed var(--line);font-size:13px;color:var(--muted);white-space:pre-wrap;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">薄肌打分器</div>

  <section id="home">
    <h1>测完告诉你<br/>是哪种薄肌生物。</h1>
    <p class="lead">薄肌质量 · AI使用率 · 孙学 · 黄毛思想。<br/>搞怪类型，类似 MBTI，但更好笑。</p>
    <p class="meta">约 1 分钟 · 12 题 · 不用登录</p>
    <div class="dims" id="dims"></div>
    <button class="btn" id="start" type="button">开始打分</button>
  </section>

  <section id="quiz" class="card hidden">
    <div class="bar"><i id="prog"></i></div>
    <div class="qno" id="qno"></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
  </section>

  <section id="result" class="hidden">
    <div class="card">
      <div class="hero">
        <div id="hideBadge" class="badge-hide hidden">隐藏人格已激活</div>
        <div class="code-big" id="typecode">SUN</div>
        <h2 class="name-big" id="typename">孙型</h2>
        <p class="subline" id="matchline"></p>
        <p class="subline" id="typeone" style="margin-top:6px"></p>
      </div>

      <div class="section">该类型的简单解读</div>
      <div class="essay" id="essay"></div>

      <div class="section">四维评分</div>
      <div id="bars"></div>

      <div class="tip" id="tip">本测试仅供娱乐。隐藏人格属于故意埋的损招，请勿当成医学、健身评估或人生判决书。</div>

      <div class="section">结果图</div>
      <div class="poster" id="poster">
        <div class="ph-code" id="phCode">SUN</div>
        <div class="ph-name" id="phName">孙型</div>
        <div class="ph-score" id="phScore">薄肌指数 60</div>
        <div class="ph-hint">海报图位占位中。正式分享图之后会补上，现在可以先截图或复制文案发群。</div>
      </div>
      <button class="btn dark" id="savePoster" type="button">查看并保存结果图（即将上线）</button>
      <button class="btn" id="copy" type="button">复制分享文案</button>
      <button class="btn ghost" id="again" type="button">再测一次</button>
      <div class="share-box hidden" id="sharePreview"></div>
    </div>
  </section>

  <p class="foot">仅供娱乐，别拿去面试或相亲。<br/>薄肌打分器</p>
</div>

  {dim:"M", q:"朋友怂恿你冲，你？", opts:[["稳",0],["心动",2],["已经在路上",4]]}
];

let i=0, answers={Q:[],A:[],S:[],M:[]};
const $=id=>document.getElementById(id);
function show(id){["home","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id)); window.scrollTo({top:0,behavior:"smooth"});}
function avg(a){return a.reduce((x,y)=>x+y,0)/(a.length||1)}
function toLevel(v){return Math.max(0,Math.min(4,Math.round(avg(v))));}

function matchType(levels){
  const vec = ["Q","A","S","M"].map(id=>levels[id]);
  // hidden triggers
  if(vec.every(v=>v<=1) && vec.filter(v=>v===0).length>=3){
    return {t:TYPES.find(x=>x.code==="VOID"), dist:0, match:100, hidden:true};
  }
  if(levels.Q>=3 && levels.S<=1 && levels.M<=1){
    return {t:TYPES.find(x=>x.code==="PURE"), dist:0, match:96, hidden:true};
  }
  if(levels.A>=3 && levels.Q<=2 && levels.M>=2 && levels.S<=3){
    // soft drip: high AI + mid impulse + not thick
    const drip = TYPES.find(x=>x.code==="DRIP");
    const d = manhattan(vec, drip.profile);
    if(d<=3 && levels.Q<=2){
      return {t:drip, dist:d, match:Math.max(80, 100-d*6), hidden:true};
    }
  }
  let best=null, bestD=1e9;
  for(const t of TYPES){
    if(t.hidden) continue;
    const d = manhattan(vec, t.profile);
    if(d<bestD){bestD=d; best=t;}
  }
  const match = Math.max(52, Math.round(100 - bestD * 8));
  return {t:best, dist:bestD, match, hidden:!!best.hidden};
}
function manhattan(a,b){return a.reduce((s,v,i)=>s+Math.abs(v-b[i]),0)}

function renderHome(){
  $("dims").innerHTML = DIMS.map(d=>`<div class="dim"><b>${d.name}</b><span>${d.blurb}</span></div>`).join("");
}
function renderQ(){
  const t=QUESTIONS[i];
  const d=dimById[t.dim];
  $("qno").textContent = `第 ${i+1} / ${QUESTIONS.length} 题 · ${d.name}`;
  $("qtext").textContent = t.q;
  $("prog").style.width = ((i/QUESTIONS.length)*100)+"%";
  $("opts").innerHTML="";
  t.opts.forEach(([text,score], idx)=>{
    const b=document.createElement("button");
    b.type="button"; b.className="opt";
    b.innerHTML = `<span class="abc">${ABC[idx]}</span><span class="txt">${text}</span>`;
    b.onclick=()=>{answers[t.dim].push(score); i++; i>=QUESTIONS.length?finish():renderQ();};
    $("opts").appendChild(b);
  });
}
function shareText(score,t,levels,match){
  const dimLine = DIMS.map(d=>`${d.name}${LEVELS[levels[d.id]]}`).join(" · ");
  return `我测出【${t.code} · ${t.name}】\n匹配度 ${match}% · 薄肌指数 ${score}\n${t.one}\n${dimLine}\n你也来测：https://thinmuscle.pages.dev/\n#薄肌打分器 #薄肌指数`;
}
function finish(){
  $("prog").style.width="100%";
  const levels={};
  let sum=0;
  DIMS.forEach(d=>{
    const lv=toLevel(answers[d.id]);
    levels[d.id]=lv;
    sum += [20,40,60,80,100][lv];
  });
  const score=Math.round(sum/4);
  const {t, match, hidden} = matchType(levels);
  const text = shareText(score,t,levels,match);
  window.__last={score,t,levels,match,hidden,text};

  $("hideBadge").classList.toggle("hidden", !hidden);
  $("typecode").textContent = t.code;
  $("typename").textContent = t.name;
  $("matchline").textContent = hidden
    ? `匹配度 ${match}% · ${t.hook}`
    : `匹配度 ${match}% · 薄肌指数 ${score}`;
  $("typeone").textContent = t.one;
  $("essay").textContent = t.essay;
  $("bars").innerHTML = DIMS.map(d=>{
    const lv=levels[d.id];
    const w=[20,40,60,80,100][lv];
    const pts=[2,3,4,5,6][lv];
    return `<div class="row"><div class="lab"><span>${d.name}</span><span class="lv">${LEVELS[lv]} / ${pts}分</span></div><div class="track"><span style="width:${w}%"></span></div><div class="note">${d.levels[LEVELS[lv]]}</div></div>`;
  }).join("");
  $("phCode").textContent = t.code;
  $("phName").textContent = t.name;
  $("phScore").textContent = `薄肌指数 ${score} · 匹配度 ${match}%`;
  $("sharePreview").classList.add("hidden");
  $("savePoster").textContent = "查看并保存结果图（即将上线）";
  show("result");
}

$("start").onclick=()=>{i=0;answers={Q:[],A:[],S:[],M:[]};show("quiz");renderQ();};
$("again").onclick=()=>{i=0;answers={Q:[],A:[],S:[],M:[]};show("quiz");renderQ();};
$("savePoster").onclick=()=>{
  $("savePoster").textContent="海报图稍后补上，先截图或复制文案吧";
  setTimeout(()=>$("savePoster").textContent="查看并保存结果图（即将上线）",2200);
};
$("copy").onclick=async()=>{
  const text=window.__last.text;
  try{
    await navigator.clipboard.writeText(text);
    $("copy").textContent="已复制，去粘贴吧";
    setTimeout(()=>$("copy").textContent="复制分享文案",1600);
  }catch(e){
    $("sharePreview").textContent=text;
    $("sharePreview").classList.remove("hidden");
    $("copy").textContent="复制失败，文案在下方";
  }
};
renderHome();
</script>
