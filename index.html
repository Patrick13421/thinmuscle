<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>TMI 薄肌指数</title>
<meta name="description" content="生活作息、肌肉含量、AI使用率、投资风险、食物维度——给你一张可爱的薄肌报表。"/>
<style>
:root{--g:#22c55e;--g2:#4ade80;--g3:#bbf7d0;--bg:#f3faf4;--ink:#14532d;--card:#fff;--muted:#4d7c5a;--line:#c6ebd0;--soft:#e8f8ec}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#dcfce7,transparent),var(--bg);color:var(--ink);min-height:100vh;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 72px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font-weight:900;letter-spacing:.14em;color:var(--g);font-size:1.1rem}
.pill{font-size:11px;background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px;color:var(--muted)}
.hero-badge{display:inline-block;background:#fff;border:1px solid var(--line);color:var(--g);padding:4px 10px;border-radius:999px;font-size:12px;margin-bottom:10px}
h1{font-size:clamp(1.55rem,5vw,2rem);line-height:1.25;margin:6px 0 10px}
.lead{color:var(--muted);margin-bottom:14px}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 16px}
.dim{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;box-shadow:0 6px 16px rgba(20,83,45,.04)}
.dim b{display:block;color:var(--g);font-size:12px;margin-bottom:4px;letter-spacing:.04em}
.stat{margin:12px 0 16px;padding:10px 12px;border-radius:12px;background:var(--soft);border:1px dashed var(--line);font-size:13px;color:var(--muted)}
.btn{width:100%;padding:14px 18px;border:none;border-radius:999px;background:linear-gradient(90deg,#16a34a,#22c55e);color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:0 8px 20px rgba(34,197,94,.25)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(20,83,45,.06)}
.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#86efac);transition:.2s}
.qno{font-size:12px;color:var(--g);letter-spacing:.1em;margin-bottom:8px;font-weight:700}
.q{font-size:1.18rem;font-weight:800;margin-bottom:14px}
.opt{width:100%;text-align:left;margin:9px 0;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#fbfffc;color:var(--ink);font-size:.98rem;cursor:pointer}
.opt:hover{border-color:var(--g);background:#f0fdf4}
.hidden{display:none!important}
.emoji{font-size:2.2rem;margin:4px 0}
.code{font-family:ui-monospace,Consolas,monospace;color:var(--g);letter-spacing:.14em;font-size:.85rem;font-weight:700}
.rname{font-size:1.9rem;font-weight:900;margin:4px 0}
.rtag{color:var(--muted);margin-bottom:8px}
.rline{font-size:1.05rem;color:#15803d;margin:8px 0 12px;font-weight:700}
.bars{margin:14px 0}
.bar-row{margin:10px 0}
.bar-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.bar-track{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar-track span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#86efac,#22c55e)}
.lmh{font-family:ui-monospace,monospace;color:var(--g);font-weight:700}
.report{margin-top:10px;padding:14px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.stamp{display:inline-block;margin-top:12px;padding:6px 10px;border-radius:999px;background:#fff;border:1px dashed var(--g);color:var(--g);font-size:12px}
.foot{margin-top:26px;text-align:center;font-size:12px;color:#7aa388}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">TMI</div><div class="pill">薄肌指数 · 可爱审判</div></div>
  <section id="home">
    <span class="hero-badge">不收集账号 · 结果只在你手机里</span>
    <h1>增肌已经过时，<br/>TMI 来咯。</h1>
    <p class="lead">我们从生活作息、肌肉含量、AI 使用率、投资风险、食物维度五条线给你打分，最后吐一张软乎乎又能发群的报表。</p>
    <div class="dims" id="dimCards"></div>
    <div class="stat">12 题 · 大约 2 分钟 · 本地出结果</div>
    <button class="btn" id="start">开始被轻轻审判</button>
  </section>
  <section id="quiz" class="card hidden">
    <div class="progress"><i id="bar"></i></div>
    <div class="qno" id="qno"></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
  </section>
  <section id="result" class="hidden">
    <div class="card">
      <div class="emoji" id="remoji"></div>
      <div class="code" id="rcode"></div>
      <div class="rname" id="rname"></div>
      <div class="rtag" id="rtag"></div>
      <div class="rline" id="rline"></div>
      <div class="bars" id="bars"></div>
      <div class="report" id="rreport"></div>
      <div class="stamp" id="rpattern"></div>
      <p class="stat" style="margin-top:14px">截图这一页发群就行，别把链接里的个人主页乱甩哦</p>
      <button class="btn" id="copy">复制可爱结果文案</button>
      <button class="btn ghost" id="again">再测一次</button>
    </div>
  </section>
  <p class="foot">TMI · Thin Muscle Index</p>
</div>
<script>
const QUESTIONS=[{"dim": "LIFE", "q": "闹钟响了第三遍，你？", "opts": [["再睡五分钟，第五次了", 0], ["起来，但先刷半小时短视频", 1], ["已经在洗冷水澡并反省人生", 2]]}, {"dim": "LIFE", "q": "周末最真实的时间表是？", "opts": [["昼伏夜出，和太阳错峰办公", 0], ["计划很多，执行了起床和点外卖", 1], ["生物钟像公务员，准时恨自己", 2]]}, {"dim": "MUSC", "q": "有人摸你手臂，你心里想的是？", "opts": [["别摸，那里还在施工", 0], ["角度对的话其实有一点点", 1], ["来，二头再来一组给你看", 2]]}, {"dim": "MUSC", "q": "你对「薄肌」这个词的态度？", "opts": [["这说的不就是我本传吗", 0], ["阶段性产物，马上就厚了（三年了）", 1], ["我？我明明是体脂管理专家", 2]]}, {"dim": "AIAI", "q": "练前你会？", "opts": [["问 AI 今天练啥，然后改成躺着", 0], ["让 AI 写分化，自己再改三遍", 1], ["AI 只配给我记组数，计划我自己有", 2]]}, {"dim": "AIAI", "q": "刷到健身 AI 生成图，你？", "opts": [["保存当目标，目标永久冻结", 0], ["研究提示词，想生成一个更像自己的", 1], ["嘲讽画质，继续刷下一个", 2]]}, {"dim": "RISK", "q": "蛋白粉、课程、私教课同时打折，你？", "opts": [["全都要，信用卡说可以", 0], ["先买蛋白粉，课程加购物车过夜", 1], ["算 ROI，最后只买了香蕉", 2]]}, {"dim": "RISK", "q": "朋友安利「稳赚」的健身副业/币，你？", "opts": [["已经转了，肌肉和资产一起波动", 0], ["先观望，收藏了十条避雷帖", 1], ["回了句：我只投资睡眠", 2]]}, {"dim": "FOOD", "q": "训练日晚饭主流选择？", "opts": [["鸡胸干到怀疑人生", 0], ["外卖备注少油，然后加一份炸鸡", 1], ["火锅配奶茶，明天再补（不会补）", 2]]}, {"dim": "FOOD", "q": "冰箱里最能代表你的食物是？", "opts": [["过期的希腊酸奶和半罐蛋白粉", 0], ["预制菜和能量棒和平共处", 1], ["只有外卖袋子和一瓶冰可乐", 2]]}, {"dim": "MUSC", "q": "镜子自拍的标准流程？", "opts": [["吸腹、侧光、修到妈都认不出", 0], ["拍十张删九张，发一张说随手", 1], ["素颜怼脸，评论区自己先点赞", 2]]}, {"dim": "LIFE", "q": "健身 App 连续打卡中断后你？", "opts": [["注销重来，心理上清零更爽", 0], ["装没看见，从「重新开始」按钮滑过", 1], ["无所谓，肌肉记得我（它不记得）", 2]]}];
const DIM_META={"LIFE": {"name": "生活作息", "blurb": "你和太阳的关系，偶尔比杠铃更紧张。"}, "MUSC": {"name": "肌肉含量", "blurb": "主观肌肉量表，单位：可爱的幻觉克。"}, "AIAI": {"name": "AI使用率", "blurb": "计划和借口，谁先被生成。"}, "RISK": {"name": "投资风险", "blurb": "钱往哪冲，薄就往哪飞。"}, "FOOD": {"name": "食物维度", "blurb": "增肌食谱在备忘录，执行在外卖盒。"}};
const TYPES=[{"code": "PAPER", "name": "纸片肌", "emoji": "📄✨", "tag": "镜头里的小英雄", "ideal": {"LIFE": 0, "MUSC": 0, "AIAI": 1, "RISK": 1, "FOOD": 1}, "line": "你不是没练，你是练给闪光灯看的小星星。", "report": "侧光是你的私教，美颜是你的增肌粉。现实里薄得诚实，照片里厚得可疑——这叫视觉管理，很会哦。"}, {"code": "THEO", "name": "理论肌", "emoji": "📚💚", "tag": "PPT 腱子肉", "ideal": {"LIFE": 1, "MUSC": 0, "AIAI": 2, "RISK": 1, "FOOD": 0}, "line": "肌群住在文档里，酸痛住在想象里。", "report": "你能讲清顶峰收缩，却讲不清上次突破。AI 是第二教练，评论区是第二健身房。知识密度满分，横截面积还在加载。"}, {"code": "ACXX", "name": "空调肌", "emoji": "❄️🧸", "tag": "恒温小动物", "ideal": {"LIFE": 0, "MUSC": 0, "AIAI": 0, "RISK": 0, "FOOD": 2}, "line": "出汗可选，薄是默认皮肤。", "report": "26°C 是你的训练阈值。计划热血，执行宜人。肌肉很薄，借口很厚，导热系数低到可爱。"}, {"code": "SOC1", "name": "搭子肌", "emoji": "👯🫧", "tag": "群聊充能款", "ideal": {"LIFE": 1, "MUSC": 1, "AIAI": 1, "RISK": 1, "FOOD": 2}, "line": "有人看才有输出，独处时进入省电模式。", "report": "一个人练像加班，有搭子像春游。容量曲线和群红点正相关。薄肌不是体质，是排期没排上你。"}, {"code": "LABB", "name": "老实肌", "emoji": "💪🥺", "tag": "真去了真努力", "ideal": {"LIFE": 2, "MUSC": 1, "AIAI": 0, "RISK": 2, "FOOD": 0}, "line": "投入很实在，镜子有点慢热。", "report": "你酸过、喝过、到过。回报像延迟到账。你是薄肌界劳动小模范：不靠滤镜，只靠觉和饭慢慢堆。"}, {"code": "AIGY", "name": "提示词肌", "emoji": "🤖🌱", "tag": "Prompt 园艺家", "ideal": {"LIFE": 1, "MUSC": 0, "AIAI": 2, "RISK": 0, "FOOD": 1}, "line": "先生成完美计划，再生成完美拖延。", "report": "分化表比斜方肌整齐。AI 三千字，你热身三组。订阅很大胆，卧推很保守，很有反差萌。"}, {"code": "LEVER", "name": "杠杆肌", "emoji": "📈🐥", "tag": "波动小甜心", "ideal": {"LIFE": 0, "MUSC": 1, "AIAI": 1, "RISK": 0, "FOOD": 2}, "line": "仓位有时候比体脂更刺激。", "report": "蛋白粉、课程、奇怪的「稳赚」你都点过。薄的时候叫回调，厚的时候叫基本面。市场和肌肉一起抖。"}, {"code": "MEAL", "name": "外卖肌", "emoji": "🍜💕", "tag": "备注少油大师", "ideal": {"LIFE": 0, "MUSC": 0, "AIAI": 1, "RISK": 1, "FOOD": 2}, "line": "增肌窗口开在美团。", "report": "鸡胸在购物车，炸鸡在嘴里。宏量营养素你会算，多巴胺你会下单。薄肌是热量管理太成功的副作用，也挺可爱。"}, {"code": "ZZZZ", "name": "作息肌", "emoji": "🌙🐱", "tag": "夜猫训练员", "ideal": {"LIFE": 0, "MUSC": 0, "AIAI": 0, "RISK": 1, "FOOD": 1}, "line": "肌肉爱睡觉，你把觉排到凌晨。", "report": "你和太阳错峰，和杠铃也常错峰。作息把其他维度拖进夜盘。薄，有一部分是时差宝宝。"}, {"code": "CTRL", "name": "拿捏肌", "emoji": "🎮👑", "tag": "自我感觉良好版", "ideal": {"LIFE": 2, "MUSC": 2, "AIAI": 1, "RISK": 2, "FOOD": 1}, "line": "怎么样，被你自己拿捏了吧？", "report": "计划、饮食、风险、滤镜强度都觉得尽在掌握。别人看你还偏薄，你看自己已是版本答案。自信是最好的泵感，继续发光。"}];
const DIMS=["LIFE","MUSC","AIAI","RISK","FOOD"];
const LMH=["L","M","H"];
let i=0, scores={LIFE:[],MUSC:[],AIAI:[],RISK:[],FOOD:[]};
const $=id=>document.getElementById(id);
function show(id){["home","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));}
function levelOf(arr){if(!arr.length)return 1;const avg=arr.reduce((a,b)=>a+b,0)/arr.length;if(avg<0.75)return 0;if(avg>1.25)return 2;return 1;}
function matchType(levels){let best=null,bestDist=1e9;for(const t of TYPES){let d=0;for(const k of DIMS)d+=Math.abs(levels[k]-t.ideal[k]);if(d<bestDist){bestDist=d;best=t;}}return {type:best,match:Math.max(0,Math.round((1-bestDist/10)*100))};}
function renderHome(){$("dimCards").innerHTML=DIMS.map(k=>{const m=DIM_META[k];return `<div class="dim"><b>${k} · ${m.name}</b>${m.blurb}</div>`;}).join("");}
function renderQ(){const t=QUESTIONS[i];$("qno").textContent=`第 ${i+1} / ${QUESTIONS.length} 题 · ${DIM_META[t.dim].name}`;$("qtext").textContent=t.q;$("bar").style.width=(i/QUESTIONS.length*100)+"%";$("opts").innerHTML="";t.opts.forEach(([text,lv])=>{const b=document.createElement("button");b.className="opt";b.textContent=text;b.onclick=()=>{scores[t.dim].push(lv);i++;i>=QUESTIONS.length?finish():renderQ();};$("opts").appendChild(b);});}
function finish(){$("bar").style.width="100%";const levels={};DIMS.forEach(k=>levels[k]=levelOf(scores[k]));const {type:t,match}=matchType(levels);window.__last={t,levels,match};$("remoji").textContent=t.emoji;$("rcode").textContent=`TMI · ${t.code}`;$("rname").textContent=t.name;$("rtag").textContent=`${t.tag} · 匹配度 ${match}%`;$("rline").textContent=t.line;$("rreport").textContent=t.report;$("rpattern").textContent="五维 "+DIMS.map(k=>LMH[levels[k]]).join("")+" · "+DIMS.map(k=>DIM_META[k].name+"="+LMH[levels[k]]).join(" / ");$("bars").innerHTML=DIMS.map(k=>{const lv=levels[k];const w=[34,67,100][lv];return `<div class="bar-row"><div class="bar-lab"><span>${DIM_META[k].name}</span><span class="lmh">${LMH[lv]}</span></div><div class="bar-track"><span style="width:${w}%"></span></div></div>`;}).join("");show("result");}
$("start").onclick=()=>{i=0;scores={LIFE:[],MUSC:[],AIAI:[],RISK:[],FOOD:[]};show("quiz");renderQ();};
$("again").onclick=()=>{i=0;scores={LIFE:[],MUSC:[],AIAI:[],RISK:[],FOOD:[]};show("quiz");renderQ();};
$("copy").onclick=()=>{const {t,levels,match}=window.__last;const pattern=DIMS.map(k=>LMH[levels[k]]).join("");navigator.clipboard.writeText(`${t.emoji} 我的TMI是【${t.code}·${t.name}】匹配${match}%\n${t.line}\n五维 ${pattern}\n#TMI #薄肌指数`).then(()=>alert("已复制～"));};
renderHome();
</script>
</body>
</html>
