<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>TMI 薄肌指数 — 增肌已经过时，TMI 来了</title>
<meta name="description" content="从生活作息、肌肉含量、AI使用率、投资风险、食物维度审判你的薄肌人格。"/>
<style>
:root{
  --g:#16a34a; --g2:#22c55e; --g3:#86efac; --bg:#07140c; --card:#0c1f14;
  --text:#ecfdf3; --muted:#86a897; --line:#1a3d28; --bad:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55}
a{color:var(--g2)}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 64px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.logo{font-weight:800;letter-spacing:.12em;color:var(--g2)}
.pill{font-size:12px;border:1px solid var(--line);padding:4px 10px;border-radius:999px;color:var(--muted)}
h1{font-size:clamp(1.6rem,5vw,2.1rem);line-height:1.25;margin:8px 0 12px}
.lead{color:var(--muted);margin-bottom:18px}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 20px}
.dim{border:1px solid var(--line);background:var(--card);padding:10px 12px;border-radius:10px;font-size:13px}
.dim b{display:block;color:var(--g3);margin-bottom:2px;font-size:12px;letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:14px 18px;border:none;border-radius:12px;background:var(--g);color:#041006;font-weight:800;font-size:1.05rem;cursor:pointer}
.btn:active{transform:scale(.99)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--g3);margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.progress{height:6px;background:#05150c;border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2));width:0;transition:.2s}
.qno{font-size:12px;color:var(--g2);letter-spacing:.14em;margin-bottom:8px}
.q{font-size:1.2rem;font-weight:700;margin-bottom:16px}
.opt{width:100%;text-align:left;margin:8px 0;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#081810;color:var(--text);font-size:.98rem;cursor:pointer}
.opt:hover,.opt:focus{border-color:var(--g2);background:#0f2919}
.hidden{display:none!important}
.code{font-family:ui-monospace,Consolas,monospace;color:var(--g2);letter-spacing:.16em;font-size:.85rem}
.rname{font-size:2rem;font-weight:900;margin:6px 0;color:#fff}
.rtag{color:var(--muted);margin-bottom:10px}
.rline{font-size:1.05rem;color:var(--g3);margin:10px 0 14px}
.bars{margin:16px 0}
.bar-row{margin:10px 0}
.bar-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.bar-track{height:10px;background:#05150c;border-radius:99px;overflow:hidden;display:flex}
.bar-track span{height:100%}
.bar-track .L{background:#365314}.bar-track .M{background:#65a30d}.bar-track .H{background:#bbf7d0}
.lmh{font-family:ui-monospace,monospace;color:var(--g2)}
.report{margin-top:12px;padding:14px;border-left:3px solid var(--g);background:#081810;border-radius:0 10px 10px 0}
.foot{margin-top:28px;text-align:center;font-size:12px;color:#4d6b58}
.stat{margin:14px 0;padding:10px 12px;border-radius:10px;background:#081810;border:1px dashed var(--line);font-size:13px;color:var(--muted)}
.hero-badge{display:inline-block;background:rgba(34,197,94,.12);border:1px solid var(--g);color:var(--g2);padding:4px 10px;border-radius:999px;font-size:12px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">TMI</div><div class="pill">THIN MUSCLE INDEX</div></div>

  <section id="home">
    <span class="hero-badge">MBTI 管不了你的卧推</span>
    <h1>增肌已经过时，<br/>TMI 来了。</h1>
    <p class="lead">一场针对薄肌生物的现场审判。我们从生活作息、肌肉含量、AI 使用率、投资风险等级、食物维度五条线给你打分，最后吐出一张能发群的报表。</p>
    <div class="dims" id="dimCards"></div>
    <div class="stat">12 题 · 约 2 分钟 · 本地出结果 · 不收你隐私也不收你蛋白粉钱</div>
    <button class="btn" id="start">开始被审判</button>
  </section>

  <section id="quiz" class="card hidden">
    <div class="progress"><i id="bar"></i></div>
    <div class="qno" id="qno"></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
  </section>

  <section id="result" class="hidden">
    <div class="card">
      <div class="code" id="rcode"></div>
      <div class="rname" id="rname"></div>
      <div class="rtag" id="rtag"></div>
      <div class="rline" id="rline"></div>
      <div class="bars" id="bars"></div>
      <div class="report" id="rreport"></div>
      <p class="stat" id="rpattern"></p>
      <button class="btn" id="copy">复制结果文案</button>
      <button class="btn ghost" id="again">再测一次</button>
    </div>
  </section>

  <p class="foot">TMI · Thin Muscle Index · 全面模仿那种绿色废话测试的快乐</p>
</div>
<script>
const QUESTIONS = [{"dim": "LIFE", "q": "闹钟响了第三遍，你？", "opts": [["再睡五分钟，第五次了", 0], ["起来，但先刷半小时短视频", 1], ["已经在洗冷水澡并反省人生", 2]]}, {"dim": "LIFE", "q": "周末最真实的时间表是？", "opts": [["昼伏夜出，和太阳错峰办公", 0], ["计划很多，执行了起床和点外卖", 1], ["生物钟像公务员，准时恨自己", 2]]}, {"dim": "MUSC", "q": "有人摸你手臂，你心里想的是？", "opts": [["别摸，那里还在施工", 0], ["角度对的话其实有一点点", 1], ["来，二头再来一组给你看", 2]]}, {"dim": "MUSC", "q": "你对「薄肌」这个词的态度？", "opts": [["这说的不就是我本传吗", 0], ["阶段性产物，马上就厚了（三年了）", 1], ["我？我明明是体脂管理专家", 2]]}, {"dim": "AIAI", "q": "练前你会？", "opts": [["问 AI 今天练啥，然后改成躺着", 0], ["让 AI 写分化，自己再改三遍", 1], ["AI 只配给我记组数，计划我自己有", 2]]}, {"dim": "AIAI", "q": "刷到健身 AI 生成图，你？", "opts": [["保存当目标，目标永久冻结", 0], ["研究提示词，想生成一个更像自己的", 1], ["嘲讽画质，继续刷下一个", 2]]}, {"dim": "RISK", "q": "蛋白粉、课程、私教课同时打折，你？", "opts": [["全都要，信用卡说可以", 0], ["先买蛋白粉，课程加购物车过夜", 1], ["算 ROI，最后只买了香蕉", 2]]}, {"dim": "RISK", "q": "朋友安利「稳赚」的健身副业/币，你？", "opts": [["已经转了，肌肉和资产一起波动", 0], ["先观望，收藏了十条避雷帖", 1], ["回了句：我只投资睡眠", 2]]}, {"dim": "FOOD", "q": "训练日晚饭主流选择？", "opts": [["鸡胸干到怀疑人生", 0], ["外卖备注少油，然后加一份炸鸡", 1], ["火锅配奶茶，明天再补（不会补）", 2]]}, {"dim": "FOOD", "q": "冰箱里最能代表你的食物是？", "opts": [["过期的希腊酸奶和半罐蛋白粉", 0], ["预制菜和能量棒和平共处", 1], ["只有外卖袋子和一瓶冰可乐", 2]]}, {"dim": "MUSC", "q": "镜子自拍的标准流程？", "opts": [["吸腹、侧光、修到妈都认不出", 0], ["拍十张删九张，发一张说随手", 1], ["素颜怼脸，评论区自己先点赞", 2]]}, {"dim": "LIFE", "q": "健身 App 连续打卡中断后你？", "opts": [["注销重来，心理上清零更爽", 0], ["装没看见，从「重新开始」按钮滑过", 1], ["无所谓，肌肉记得我（它不记得）", 2]]}];
const DIM_META = {"LIFE": {"name": "生活作息", "blurb": "你和太阳的关系，比你和杠铃更紧张。"}, "MUSC": {"name": "肌肉含量", "blurb": "主观肌肉量表，单位：幻觉克。"}, "AIAI": {"name": "AI使用率", "blurb": "计划和借口，哪个先被生成。"}, "RISK": {"name": "投资风险", "blurb": "钱往哪冲，薄就往哪飞。"}, "FOOD": {"name": "食物维度", "blurb": "增肌食谱写在备忘录，执行在外卖盒。"}};
const TYPES = [{"code": "PAPER", "name": "纸片肌", "tag": "视觉承包商", "ideal": {"LIFE": 0, "MUSC": 0, "AIAI": 1, "RISK": 1, "FOOD": 1}, "line": "你不是没练，你是练给像素看的。", "report": "侧光是你的私教，美颜是你的增肌粉。实体世界里你薄得诚实，镜头里你厚得可疑。朋友说你瘦，你说平台期；朋友说你壮，你知道那是 0.7x。"}, {"code": "THEO", "name": "理论肌", "tag": "PPT 腱子肉", "ideal": {"LIFE": 1, "MUSC": 0, "AIAI": 2, "RISK": 1, "FOOD": 0}, "line": "肌群在文档里，酸痛在想象里。", "report": "你能讲清顶峰收缩，却讲不清上次突破。AI 是你的第二教练，评论区是你的第二健身房。知识密度拉满，横截面积暂缓上市。"}, {"code": "ACXX", "name": "空调肌", "tag": "恒温动物", "ideal": {"LIFE": 0, "MUSC": 0, "AIAI": 0, "RISK": 0, "FOOD": 2}, "line": "出汗是可选项，薄是默认皮肤。", "report": "26°C 是你的训练阈值。计划写得很热血，执行温度永远宜人。肌肉很薄，但借口很厚，导热系数极低。"}, {"code": "SOC1", "name": "搭子肌", "tag": "群聊驱动型", "ideal": {"LIFE": 1, "MUSC": 1, "AIAI": 1, "RISK": 1, "FOOD": 2}, "line": "有人看才有输出，无人时进入省电。", "report": "一个人练像刑满，有搭子像奥运。你的容量曲线和群消息红色角标正相关。薄肌不是体质，是排期事故。"}, {"code": "LABB", "name": "老实肌", "tag": "真去了真薄了", "ideal": {"LIFE": 2, "MUSC": 1, "AIAI": 0, "RISK": 2, "FOOD": 0}, "line": "投入真实，镜子演默剧。", "report": "你酸过、喝过、到过。回报像延迟到账的工资。你是薄肌界劳动模范：不靠滤镜，只靠生物和睡眠跟你作对。"}, {"code": "AIGY", "name": "提示词肌", "tag": "Prompt 增肌法", "ideal": {"LIFE": 1, "MUSC": 0, "AIAI": 2, "RISK": 0, "FOOD": 1}, "line": "先生成完美计划，再生成完美拖延。", "report": "你的分化表比你的斜方肌整齐。AI 输出三千字，你执行三组热身。风险偏好高在订阅，低在卧推重量。"}, {"code": "LEVER", "name": "杠杆肌", "tag": "波动即正义", "ideal": {"LIFE": 0, "MUSC": 1, "AIAI": 1, "RISK": 0, "FOOD": 2}, "line": "仓位比体脂更刺激。", "report": "蛋白粉、课程、莫名其妙的「稳赚」你都点过。肌肉曲线跟着账户走，薄的时候说是回调，厚的时候说是基本面。"}, {"code": "MEAL", "name": "外卖肌", "tag": "备注少油大师", "ideal": {"LIFE": 0, "MUSC": 0, "AIAI": 1, "RISK": 1, "FOOD": 2}, "line": "增肌窗口开在美团。", "report": "鸡胸在购物车，炸鸡在嘴里。你对食物维度极度诚实：宏量营养素会算，多巴胺会下单。薄肌是热量管理过于成功的副作用。"}, {"code": "ZZZZ", "name": "作息肌", "tag": "昼夜颠倒款", "ideal": {"LIFE": 0, "MUSC": 0, "AIAI": 0, "RISK": 1, "FOOD": 1}, "line": "肌肉生长在睡眠里，你把睡眠排到凌晨。", "report": "你和太阳错峰办公，和杠铃也经常错峰。生活作息维度直接把其他维度拖进夜盘。薄，有一部分是时差。"}, {"code": "CTRL", "name": "拿捏肌", "tag": "自我感觉良好版", "ideal": {"LIFE": 2, "MUSC": 2, "AIAI": 1, "RISK": 2, "FOOD": 1}, "line": "怎么样，被你自己拿捏了吧？", "report": "你觉得一切尽在掌握：计划、饮食、风险、甚至滤镜强度。别人看你还是偏薄，你看自己已经是版本答案。自信是最好的泵感。"}];
const DIMS = ["LIFE","MUSC","AIAI","RISK","FOOD"];
const LMH = ["L","M","H"];
let i=0, scores={LIFE:[],MUSC:[],AIAI:[],RISK:[],FOOD:[]};
const $=id=>document.getElementById(id);
function show(id){["home","quiz","result"].forEach(x=>$(x).classList.toggle("hidden", x!==id));}

function levelOf(arr){
  if(!arr.length) return 1;
  const avg = arr.reduce((a,b)=>a+b,0)/arr.length;
  if(avg < 0.75) return 0;
  if(avg > 1.25) return 2;
  return 1;
}

function matchType(levels){
  let best=null, bestDist=1e9;
  for(const t of TYPES){
    let d=0;
    for(const k of DIMS) d += Math.abs(levels[k]-t.ideal[k]);
    if(d<bestDist){bestDist=d;best=t;}
  }
  const match = Math.max(0, Math.round((1 - bestDist/10)*100));
  return {type:best, match};
}

function renderHome(){
  $("dimCards").innerHTML = DIMS.map(k=>{
    const m=DIM_META[k];
    return `<div class="dim"><b>${k} · ${m.name}</b>${m.blurb}</div>`;
  }).join("");
}

function renderQ(){
  const t=QUESTIONS[i];
  $("qno").textContent = `QUESTION ${String(i+1).padStart(2,"0")} / ${String(QUESTIONS.length).padStart(2,"0")} · ${DIM_META[t.dim].name}`;
  $("qtext").textContent = t.q;
  $("bar").style.width = (i/QUESTIONS.length*100)+"%";
  $("opts").innerHTML="";
  t.opts.forEach((opt, idx)=>{
    const [text, lv] = opt;
    const b=document.createElement("button");
    b.className="opt";
    b.textContent = text;
    b.onclick=()=>{
      scores[t.dim].push(lv);
      i++;
      if(i>=QUESTIONS.length) finish(); else renderQ();
    };
    $("opts").appendChild(b);
  });
}

function finish(){
  $("bar").style.width="100%";
  const levels={};
  DIMS.forEach(k=> levels[k]=levelOf(scores[k]));
  const {type:t, match} = matchType(levels);
  window.__last={t, levels, match};
  $("rcode").textContent = `TMI · ${t.code}`;
  $("rname").textContent = t.name;
  $("rtag").textContent = t.tag + ` · 匹配度 ${match}%`;
  $("rline").textContent = t.line;
  $("rreport").textContent = t.report;
  $("rpattern").textContent = "五维模式 " + DIMS.map(k=>LMH[levels[k]]).join("") + " · " + DIMS.map(k=>DIM_META[k].name+"="+LMH[levels[k]]).join(" / ");
  $("bars").innerHTML = DIMS.map(k=>{
    const lv=levels[k];
    const w=[33,66,100][lv];
    return `<div class="bar-row"><div class="bar-lab"><span>${DIM_META[k].name}</span><span class="lmh">${LMH[lv]}</span></div>
      <div class="bar-track"><span class="${LMH[lv]}" style="width:${w}%"></span></div></div>`;
  }).join("");
  show("result");
}

$("start").onclick=()=>{i=0; scores={LIFE:[],MUSC:[],AIAI:[],RISK:[],FOOD:[]}; show("quiz"); renderQ();};
$("again").onclick=()=>{i=0; scores={LIFE:[],MUSC:[],AIAI:[],RISK:[],FOOD:[]}; show("quiz"); renderQ();};
$("copy").onclick=()=>{
  const {t, levels, match}=window.__last;
  const pattern=DIMS.map(k=>LMH[levels[k]]).join("");
  const text=`我的TMI是【${t.code}·${t.name}】匹配${match}%\n${t.line}\n五维 ${pattern}（作息/肌肉/AI/风险/食物）\n#TMI #薄肌指数`;
  navigator.clipboard.writeText(text).then(()=>alert("已复制，去祸害群友吧"));
};

renderHome();
</script>
</body>
</html>
